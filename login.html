<main class="page-login">

    <div class="card">
        <h1>STUDENT LOGIN</h1>
        <p class="subtitle">
            سجّل دخولك لتدخل الامتحان وتحفظ نتايجك وتحمّل شهادتك.
        </p>

        <form id="loginForm" novalidate>

            <div class="field" id="nameField">
                <input type="text" id="name" placeholder=" " autocomplete="name">
                <label for="name">الاسم الكامل</label>
            </div>

            <div class="field">
                <input type="email" id="email" placeholder=" " autocomplete="email">
                <label for="email">البريد الإلكتروني</label>
            </div>

            <div class="field password" id="passwordField" hidden>
                <input type="password" id="password" placeholder=" " autocomplete="current-password">
                <label for="password">كلمة المرور</label>
                <button type="button" id="eye" aria-label="إظهار كلمة المرور">◉</button>
            </div>

            <p class="login-msg" id="loginError" role="alert"></p>

            <div class="options">
                <button type="button" class="link-btn" id="modeToggle" hidden></button>
                <a href="#" id="forgotLink" hidden>نسيت كلمة المرور؟</a>
            </div>

            <p class="login-note" id="loginNote"></p>

            <button class="login" type="submit" id="loginSubmit">تسجيل الدخول →</button>

        </form>
    </div>

</main>

<div class="success" id="success">
    <div class="success-box">
        <div class="success-icon">✓</div>
        <h2>تم الدخول بنجاح</h2>
        <p>جارٍ تحويلك...</p>
    </div>
</div>
